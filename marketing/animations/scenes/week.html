<!doctype html>
<html><head><meta charset="utf-8"><title>Week plan</title>
<!-- Unfinished backup: the week clip is being filmed for real (marketing/filming-week-plan.md).
     This animated version renders the Monday key frame only. ?v=A|B|C picks the phone finish. -->
<link rel="stylesheet" href="../kit/kit.css">
<style>
/* Phone: screen is laid out at iPhone size (390x844) and scaled as one piece */
.phone { position: relative; width: 410px; height: 864px; border-radius: 62px; padding: 10px; transform-style: preserve-3d; }
.phone .screen { position: relative; width: 390px; height: 844px; border-radius: 52px; overflow: hidden; background: #08080c; }
.island { position: absolute; left: 50%; top: 11px; width: 122px; height: 35px; margin-left: -61px; border-radius: 20px; background: #000; z-index: 50; }
.glare { position: absolute; inset: 0; pointer-events: none; z-index: 60; border-radius: inherit; }
/* A Midnight */
.v-A .phone { background: linear-gradient(145deg,#2a2833,#121117 40%,#1d1b24); box-shadow: inset 0 0 0 1.5px rgba(165,140,255,.35), 0 0 0 1px #000, 0 0 60px rgba(139,109,255,.35), 0 60px 120px rgba(0,0,0,.7); }
.v-A .glare { background: linear-gradient(115deg,transparent 40%,rgba(255,255,255,.05) 48%,transparent 56%); }
/* B Glass */
.v-B .phone { background: linear-gradient(145deg,#e9eaee,#9a9ca3 35%,#d6d8dd 60%,#7f8188); box-shadow: inset 0 0 0 1px rgba(255,255,255,.7), 0 0 0 1px #4a4b50, 0 60px 120px rgba(0,0,0,.7); }
.v-B .glare { background: linear-gradient(115deg,transparent 30%,rgba(255,255,255,.16) 42%,rgba(255,255,255,.04) 52%,transparent 60%); }
/* C Floating */
.v-C .phone { background: none; padding: 0; width: 390px; height: 844px; }
.v-C .phone .screen { border-radius: 48px; box-shadow: 0 0 0 1.5px rgba(139,109,255,.55), 0 0 70px rgba(139,109,255,.4), 0 60px 120px rgba(0,0,0,.7); }

/* Status bar */
.status { height: 54px; display: flex; align-items: center; justify-content: space-between; padding: 6px 34px 0 46px; font-size: 16px; font-weight: 650; }
/* Calendar screen (Calendar.jsx, WeekStrip.jsx, DayTimeline.jsx) */
.app { padding: 4px 18px 0; }
.hdr { display: flex; align-items: center; gap: 12px; margin-top: 6px; }
.back { width: 40px; height: 40px; border-radius: 14px; background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.08); display: flex; align-items: center; justify-content: center; }
.strip { position: relative; display: grid; grid-template-columns: repeat(7,1fr); gap: 3px; margin-top: 16px; }
.chip { position: relative; border-radius: 999px; padding: 9px 0 10px; text-align: center; border: 1px solid transparent; }
.chip i { font-style: normal; display: block; font-size: 10px; color: #7a7a8a; letter-spacing: .06em; font-weight: 650; }
.chip b { display: block; font-size: 17px; font-weight: 700; margin-top: 3px; }
.chip.cd { background: rgba(245,165,36,.1); border-color: rgba(245,165,36,.35); box-shadow: 0 0 12px rgba(245,165,36,.18); }
.chip .bar { position: absolute; left: 30%; right: 30%; bottom: -6px; height: 3px; border-radius: 2px; background: #f5a524; }
.chip .dot { position: absolute; left: 50%; bottom: 4px; width: 4px; height: 4px; margin-left: -2px; border-radius: 50%; background: #2ee6c5; }
.sel { position: absolute; top: 0; height: 100%; border-radius: 999px; background: linear-gradient(160deg,#8b6dff,#6d4dff); box-shadow: 0 6px 18px rgba(109,77,255,.35); }
.cdcap { margin-top: 12px; font-size: 12px; font-weight: 650; color: #f5a524; text-align: center; }
.sec { font-size: 15.5px; font-weight: 750; margin: 18px 0 9px; }
.dl { padding: 13px 14px; border-radius: 18px; background: rgba(245,165,36,.06); border: 1px solid rgba(245,165,36,.28); }
.dl .s { font-size: 10.5px; font-weight: 750; letter-spacing: .06em; }
.dl .t { font-size: 15px; font-weight: 700; margin-top: 4px; }
.dl .d { font-size: 12px; color: #8a8a99; margin-top: 3px; }
.day { position: relative; }
.st { padding: 12px 14px; border-radius: 18px; background: rgba(124,92,255,.06); border: 1.5px solid rgba(124,92,255,.42); margin-bottom: 9px; }
.st .w { font-size: 11.5px; color: #8a8a99; display: flex; gap: 7px; align-items: center; }
.st .w em { font-style: normal; font-size: 10.5px; font-weight: 700; color: #9a9aab; }
.st .s { font-size: 11px; font-weight: 750; letter-spacing: .06em; text-transform: uppercase; margin-top: 7px; }
.st .t { font-size: 15.5px; font-weight: 700; margin-top: 3px; display: flex; justify-content: space-between; align-items: center; gap: 6px; }
.gp { padding: 11px 14px; border-radius: 18px; background: rgba(255,255,255,.025); border: 1px solid rgba(255,255,255,.06); margin-bottom: 9px; }
.gp .w { font-size: 11.5px; color: #8a8a99; display: flex; gap: 7px; align-items: center; }
.gp .t { font-size: 15px; font-weight: 700; margin-top: 4px; }
.act { display: flex; align-items: center; gap: 11px; padding: 11px 13px; border-radius: 18px; background: rgba(255,255,255,.035); border: 1px solid rgba(255,255,255,.07); margin-bottom: 9px; }
.act .ic { width: 34px; height: 34px; border-radius: 11px; background: rgba(46,230,197,.12); display: flex; align-items: center; justify-content: center; font-size: 18px; }
.act b { display: block; font-size: 14.5px; font-weight: 700; }
.act span { display: block; font-size: 11.5px; color: #2ee6c5; margin-top: 2px; }
.act .r { margin-left: auto; font-size: 12px; color: #8a8a99; text-align: right; }
.dlp { font-size: 10.5px; font-weight: 650; color: #f5a524; background: rgba(245,165,36,.13); padding: 3px 7px; border-radius: 7px; white-space: nowrap; }
/* Tab bar (TabBar.jsx) */
.tabs { position: absolute; left: 0; right: 0; bottom: 0; height: 88px; background: rgba(12,12,18,.92); border-top: 1px solid rgba(255,255,255,.07);
  display: grid; grid-template-columns: repeat(5,1fr); padding-top: 9px; z-index: 40; }
.tab { text-align: center; font-size: 10.5px; color: #7a7a8a; }
.tab svg { display: block; margin: 0 auto 4px; }
.tab.on { color: #a58cff; }
.fab { width: 54px; height: 54px; border-radius: 50%; margin: -26px auto 0; background: linear-gradient(160deg,#8b6dff,#6d4dff); border: 4px solid #08080c; box-shadow: 0 8px 20px rgba(109,77,255,.45);
  display: flex; align-items: center; justify-content: center; }
.homebar { position: absolute; left: 50%; bottom: 8px; width: 134px; height: 5px; margin-left: -67px; border-radius: 3px; background: rgba(255,255,255,.85); z-index: 45; }
.fadebot { position: absolute; left: 0; right: 0; bottom: 88px; height: 60px; background: linear-gradient(to top,#08080c,transparent); z-index: 39; }
</style></head>
<body>
<div class="stage">
  <div class="floats back"></div>
  <div class="world"><div class="scene"><div class="rig">
    <div class="phone"><div class="screen" id="screen">
      <div class="island"></div>
      <div class="status"><span>9:41</span><span style="display:flex;gap:6px;align-items:center">
        <svg width="18" height="12" viewBox="0 0 18 12" fill="#fff"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5.5" width="3" height="6.5" rx="1"/><rect x="10" y="3" width="3" height="9" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg>
        <svg width="26" height="13" viewBox="0 0 26 13" fill="none"><rect x=".5" y=".5" width="22" height="12" rx="3.5" stroke="rgba(255,255,255,.45)"/><rect x="2.5" y="2.5" width="16" height="8" rx="2" fill="#fff"/><rect x="24" y="4.5" width="1.6" height="4" rx=".8" fill="rgba(255,255,255,.45)"/></svg></span></div>
      <div class="app">
        <div class="hdr"><div class="back"><svg width="16" height="14" viewBox="0 0 16 14" fill="none" stroke="#f4f4f7" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M7 1L1 7l6 6M1 7h14"/></svg></div>
          <div><div style="font-size:20px;font-weight:750">Calendar</div><div style="font-size:12px;color:#8a8a99;margin-top:1px">This coming week</div></div></div>
        <div class="strip" id="strip"><div class="sel" id="sel"></div></div>
        <div class="cdcap"><span class="emo">🧬</span> Exam in 3 days</div>
        <div class="day" id="day"></div>
      </div>
      <div class="fadebot"></div>
      <div class="tabs">
        <div class="tab"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><path d="M3 10.5L12 3l9 7.5V20a1 1 0 01-1 1h-5v-6H9v6H4a1 1 0 01-1-1z"/></svg>Home</div>
        <div class="tab on"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><rect x="3.5" y="5" width="17" height="15.5" rx="3.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>Calendar
          <div style="width:22px;height:3px;border-radius:2px;margin:5px auto 0;background:linear-gradient(90deg,#8b6dff,#6d4dff)"></div></div>
        <div><div class="fab"><svg width="20" height="20" viewBox="0 0 20 20" stroke="#fff" stroke-width="2.2" stroke-linecap="round"><path d="M10 3v14M3 10h14"/></svg></div></div>
        <div class="tab"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6h11M9 12h11M9 18h11M3.5 6l1.2 1.2L7 5"/></svg>Tasks</div>
        <div class="tab"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>Profile</div>
      </div>
      <div class="homebar"></div>
      <div class="glare"></div>
    </div></div>
  </div></div></div>
  <div class="floats front"></div>
  <div class="vig"></div>
</div>
<script type="module">
import { $, seg, lerp, easeInOut, spring, makeFloats, camera, scene } from '../kit/kit.js';

document.body.classList.add('v-' + (new URLSearchParams(location.search).get('v') || 'A'));

// The week: Mon Oct 12 – Sun Oct 18. Biology test Thu; Math quiz and Physics test fall next week.
const DAYS = [
  ['MON', 12, [['st', '4:00–4:45 PM', 45, '📐 Math', '#c9baff', 'Quadratic equations', 'Math quiz · Mon'], ['st', '6:45–7:25 PM', 40, '💬 English', '#8fbaff', 'Essay homework']], ['⚽', 'Soccer training', '5:30 PM', 90]],
  ['TUE', 13, [['st', '4:00–4:40 PM', 40, '🧬 Biology', '#7ee8a8', 'Cell structure', 'Biology test · Thu'], ['st', '5:00–5:35 PM', 35, '🏛️ History', '#8fbaff', 'Revolution notes'], ['gp', '7:00 PM', 0, '', '', 'Free evening']]],
  ['WED', 14, [['st', '4:00–4:45 PM', 45, '🧬 Biology', '#7ee8a8', 'Practice questions', 'Biology test · Thu'], ['st', '7:00–7:30 PM', 30, '📐 Math', '#c9baff', 'Worksheet homework']], ['🎹', 'Piano lesson', '5:30 PM', 45]],
  ['THU', 15, [['st', '3:30–4:00 PM', 30, '📐 Math', '#c9baff', 'Fractions review', 'Math quiz · Mon'], ['gp', '7:30 PM', 0, '', '', 'Free evening']], ['⚽', 'Soccer training', '5:30 PM', 90]],
  ['FRI', 16, [['st', '4:00–4:45 PM', 45, '📐 Math', '#c9baff', 'Practice quiz', 'Math quiz · Mon'], ['st', '5:00–5:40 PM', 40, '⚛️ Physics', '#ffb38a', 'Forces & motion', 'Physics test · Tue'], ['gp', '6:00 PM', 0, '', '', 'Free time']]],
  ['SAT', 17, [['st', '10:00–10:45 AM', 45, '📐 Math', '#c9baff', 'Mistakes review', 'Math quiz · Mon'], ['gp', '11:00 AM', 0, '', '', 'Free afternoon']]],
  ['SUN', 18, [['st', '11:00–11:45 AM', 45, '⚛️ Physics', '#ffb38a', 'Formula sheet', 'Physics test · Tue'], ['st', '5:00–5:30 PM', 30, '📐 Math', '#c9baff', 'Quick self-check', 'Math quiz · Mon']]],
];
const EXAM_DAY = 3;

const strip = $('#strip');
const chips = DAYS.map(([d, n], i) => {
  const c = document.createElement('div');
  c.className = 'chip' + (i <= EXAM_DAY ? ' cd' : '');
  c.innerHTML = `<i>${d}</i><b>${n}</b>${i <= EXAM_DAY ? '<div class="bar"></div>' : ''}${i === EXAM_DAY ? '<div class="dot"></div>' : ''}`;
  strip.appendChild(c);
  return c;
});

const FULL = ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday', 'Sunday'];
function dayHTML(i) {
  const [, n, items, act] = DAYS[i];
  let h = `<div class="sec">Upcoming deadlines</div><div class="dl"><div class="s" style="color:#7ee8a8"><span class="emo">🧬</span> BIOLOGY</div>
    <div class="t" style="display:flex;justify-content:space-between">Biology test <span class="dlp">${i < EXAM_DAY ? `In ${EXAM_DAY - i} days`.replace('In 1 days', 'Tomorrow') : i === EXAM_DAY ? 'Today' : 'Done'}</span></div>
    <div class="d">Thursday, Oct 15</div></div>`;
  h += `<div class="sec">Study sessions — ${FULL[i]}</div>`;
  for (const [k, when, min, subj, col, title, dl] of items) {
    if (k === 'gp') h += `<div class="gp"><div class="w">${when}</div><div class="t">${title}</div></div>`;
    else h += `<div class="st"><div class="w">${when} <span class="pill p-purple" style="font-size:10.5px;padding:3px 7px">${min} min</span><em>Planned</em></div>
      <div class="s" style="color:${col}"><span class="emo">${subj.split(' ')[0]}</span> ${subj.split(' ').slice(1).join(' ')}</div>
      <div class="t">${title}${dl ? `<span class="dlp">${dl}</span>` : ''}</div></div>`;
  }
  if (act) h += `<div class="sec">Extra activities</div><div class="act"><div class="ic emo">${act[0]}</div><div><b>${act[1]}</b><span>Recurring activity</span></div><div class="r">${act[2]}<br>${act[3]} min</div></div>`;
  return h;
}

const floats = makeFloats([
  ['📐', 24, 110, 56, -14, 0.75], ['🧬', 455, 170, 46, 12, 0.7], ['⚽', 440, 790, 60, -10, 0.8], ['🎹', 30, 820, 48, 10, 0.65],
]);
const rig = $('.rig');
let shownDay = -1;

scene(6, (t) => {
  // Stills: key frame zoomed on Monday with the exam glow
  const day = 0;
  if (day !== shownDay) { $('#day').innerHTML = dayHTML(day); shownDay = day; }
  const c = chips[day];
  $('#sel').style.left = c.offsetLeft + 'px';
  $('#sel').style.width = c.offsetWidth + 'px';
  chips.forEach((ch, i) => { ch.style.color = i === day ? '#fff' : ''; ch.querySelector('i').style.color = i === day ? 'rgba(255,255,255,.8)' : ''; ch.style.position = 'relative'; ch.style.zIndex = 1; });
  camera(t, 1, 0, 0, floats);
  rig.style.transform = `rotateX(6deg) rotateY(-10deg) rotateZ(1deg) scale(1.02)`;
});
</script>
</body></html>
