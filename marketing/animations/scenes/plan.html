<!doctype html>
<html><head><meta charset="utf-8"><title>Plan day</title>
<link rel="stylesheet" href="../kit/kit.css">
<style>
#plan { position: absolute; left: 0; top: 50%; }
</style></head>
<body>
<div class="stage">
  <div class="floats back"></div>
  <div class="world"><div class="scene"><div class="rig">
    <div class="card home" id="empty">
      <div class="big">No sessions planned for today</div>
      <div class="sub">Plan your day to see the next session.</div>
      <div class="btns"><div class="btn" id="btn">Plan day<div class="tap" id="tap" style="left:78%;top:50%"><div class="ripple"></div><div class="finger"></div></div></div></div>
    </div>
    <div class="card" id="plan">
      <div class="big" id="ph">Thursday's plan</div>
      <div style="display:flex;gap:8px;margin-top:10px" id="pills"><span class="pill p-purple">3 study blocks</span><span class="pill p-gray">2 hr of studying</span></div>
      <div class="tl tl-study"><div class="when">4:00–4:45 PM <span class="pill p-purple">45 min</span></div><span class="subj" style="color:#c9baff"><span class="emo">📐</span> Math</span><div class="tt">Quadratic equations</div></div>
      <div class="tl tl-gap"><div class="when">4:45–5:00 PM <span class="pill p-gray">15 min</span></div><div class="tt">Break</div></div>
      <div class="tl tl-study"><div class="when">5:00–5:40 PM <span class="pill p-purple">40 min</span></div><span class="subj" style="color:#7ee8a8"><span class="emo">🧬</span> Biology</span><div class="tt">Cell structure review</div></div>
      <div class="tl tl-study"><div class="when">5:50–6:25 PM <span class="pill p-purple">35 min</span></div><span class="subj" style="color:#8fbaff"><span class="emo">💬</span> English</span><div class="tt">Essay draft</div></div>
    </div>
    <div class="floor"></div>
  </div></div></div>
  <div class="floats front"></div>
  <div class="vig"></div>
</div>
<script type="module">
import { $, seg, lerp, easeInOut, easeIn, spring, makeFloats, camera, tap, scene } from '../kit/kit.js';

const floats = makeFloats([
  ['📐', 24, 90, 74, -18, 1.25], ['🧬', 450, 150, 50, 14, 0.8], ['🧪', 425, 830, 80, -10, 1.3],
  ['📖', 30, 850, 56, 12, 0.7], ['🌍', 260, 50, 34, 0, 0.5],
]);
const rig = $('.rig'), empty = $('#empty'), plan = $('#plan'), btn = $('#btn');
const items = [...plan.querySelectorAll('.tl')], head = [$('#ph'), $('#pills')];

scene(3.4, (t) => {
  const enter = spring(seg(t, 0, 0.75), 0.3);
  const push = easeInOut(seg(t, 0.45, 1.15)) - easeInOut(seg(t, 1.4, 2.2));
  const z = lerp(1.04, 1.32, push) + seg(t, 2.2, 3.4) * 0.04;
  camera(t, z, lerp(0, 24, push), lerp(0, -70, push), floats);

  rig.style.transform = `translateZ(${(1 - enter) * -700}px) rotateX(${16 + (1 - enter) * 35}deg) rotateY(${lerp(-22, -12, push) + Math.sin(t * 1.1) * 2}deg) rotateZ(3deg) scale(1.2)`;
  rig.style.opacity = Math.min(1, 0.35 + seg(t, 0, 0.2));

  const press = tap($('#tap'), t, 0.9, 1.25);
  btn.style.transform = `scale(${1 - press * 0.05})`;
  btn.style.filter = `brightness(${1 + press * 0.25})`;

  // Empty card sinks back, the plan rises in front of it
  const away = easeIn(seg(t, 1.4, 1.85));
  empty.style.transform = `translateZ(${-away * 420}px) translateY(${-away * 60}px)`;
  empty.style.opacity = 1 - away;
  const rise = spring(seg(t, 1.45, 2.15), 0.5);
  plan.style.transform = `translateY(-50%) translateY(${(1 - rise) * 520}px) rotateX(${(1 - rise) * -25}deg)`;
  plan.style.opacity = Math.min(1, seg(t, 1.45, 1.6));
  head.forEach((el, i) => { const p = spring(seg(t, 1.7 + i * 0.08, 2.2 + i * 0.08)); el.style.opacity = Math.min(1, p * 1.5); el.style.transform = `translateY(${(1 - p) * 12}px)`; });
  items.forEach((el, i) => {
    const p = spring(seg(t, 1.85 + i * 0.18, 2.45 + i * 0.18), 0.8);
    el.style.opacity = Math.min(1, p * 1.4);
    el.style.transform = `translateY(${(1 - p) * -30}px) scale(${0.92 + p * 0.08})`;
  });
});
</script>
</body></html>
