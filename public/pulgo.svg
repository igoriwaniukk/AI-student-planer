<svg width="320" height="320" viewBox="0 0 320 320" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#3b2a86"/>
      <stop offset="0.45" stop-color="#241a5c"/>
      <stop offset="1" stop-color="#0d0a1e"/>
    </linearGradient>
    <radialGradient id="bgGlow" cx="50%" cy="32%" r="60%">
      <stop offset="0" stop-color="#7f5cff" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#7f5cff" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="furHead" cx="35%" cy="22%" r="88%">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.45" stop-color="#f5f5fa"/>
      <stop offset="0.76" stop-color="#dedeeb"/>
      <stop offset="1" stop-color="#b0b0c8"/>
    </radialGradient>
    <radialGradient id="furCheek" cx="38%" cy="28%" r="82%">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.65" stop-color="#f0f0f7"/>
      <stop offset="1" stop-color="#cdcde0"/>
    </radialGradient>
    <radialGradient id="earOuter" cx="36%" cy="24%" r="86%">
      <stop offset="0" stop-color="#565064"/>
      <stop offset="0.5" stop-color="#332e42"/>
      <stop offset="1" stop-color="#191622"/>
    </radialGradient>
    <radialGradient id="maskG" cx="42%" cy="24%" r="84%">
      <stop offset="0" stop-color="#5e5770"/>
      <stop offset="0.5" stop-color="#3b3548"/>
      <stop offset="1" stop-color="#211e2c"/>
    </radialGradient>
    <radialGradient id="noseG" cx="34%" cy="24%" r="82%">
      <stop offset="0" stop-color="#635c74"/>
      <stop offset="0.42" stop-color="#2b2734"/>
      <stop offset="1" stop-color="#0f0d15"/>
    </radialGradient>
    <radialGradient id="eyeBall" cx="34%" cy="26%" r="86%">
      <stop offset="0" stop-color="#4c4559"/>
      <stop offset="0.45" stop-color="#231e2e"/>
      <stop offset="1" stop-color="#0b0912"/>
    </radialGradient>

    <linearGradient id="blazer" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#a78dff"/>
      <stop offset="0.5" stop-color="#8163ff"/>
      <stop offset="1" stop-color="#5836db"/>
    </linearGradient>
    <linearGradient id="lapel" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#8a6cff"/>
      <stop offset="1" stop-color="#4c30c6"/>
    </linearGradient>
    <linearGradient id="shirt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#dadae8"/>
    </linearGradient>
    <linearGradient id="tieG" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#33303f"/>
      <stop offset="1" stop-color="#0b0a11"/>
    </linearGradient>

    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="7"/></filter>
    <filter id="tiny" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3"/></filter>
    <filter id="big" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="13"/></filter>
  </defs>

  <rect width="320" height="320" fill="url(#bg)"/>
  <ellipse cx="160" cy="112" rx="152" ry="122" fill="url(#bgGlow)"/>

  <!-- ===== suit ===== -->
  <g>
    <!-- jacket body -->
    <path d="M30 322 C30 262 84 234 160 234 C236 234 290 262 290 322 Z" fill="url(#blazer)"/>
    <path d="M32 320 C34 266 86 238 160 238 C234 238 286 266 288 320" fill="none" stroke="#c9b8ff" stroke-width="3" opacity="0.45"/>

    <!-- head's contact shadow, kept on the jacket only -->
    <ellipse cx="160" cy="244" rx="78" ry="18" fill="#170d3a" opacity="0.5" filter="url(#soft)"/>

    <!-- shirt V -->
    <path d="M130 246 L160 314 L190 246 L174 236 L146 236 Z" fill="url(#shirt)"/>

    <!-- lapels over the shirt edges -->
    <path d="M130 246 L106 240 L80 322 L126 322 L160 270 Z" fill="url(#lapel)"/>
    <path d="M190 246 L214 240 L240 322 L194 322 L160 270 Z" fill="url(#lapel)"/>
    <path d="M130 246 L106 240 L80 322" fill="none" stroke="#bda9ff" stroke-width="2.4" opacity="0.5"/>
    <path d="M190 246 L214 240 L240 322" fill="none" stroke="#bda9ff" stroke-width="2.4" opacity="0.5"/>

    <!-- collar flaps sitting on top of the lapels -->
    <path d="M146 237 L162 264 L131 250 Z" fill="#ffffff" stroke="#c0c0d4" stroke-width="1.4" stroke-linejoin="round"/>
    <path d="M174 237 L158 264 L189 250 Z" fill="#ffffff" stroke="#c0c0d4" stroke-width="1.4" stroke-linejoin="round"/>

    <!-- tie -->
    <path d="M151 250 L169 250 L173 266 L160 274 L147 266 Z" fill="url(#tieG)"/>
    <path d="M152 274 L168 274 L166 322 L154 322 Z" fill="url(#tieG)"/>
    <path d="M153 253 L167 253" stroke="#5d5872" stroke-width="2" opacity="0.5"/>

    <!-- pocket square -->
    <path d="M212 288 L238 282 L232 302 Z" fill="#f3f3fb"/>
  </g>

  <!-- ===== head (wide, round pug skull) ===== -->
  <path d="M160 44 C216 44 256 84 256 142 C256 198 218 236 160 236 C102 236 64 198 64 142 C64 84 104 44 160 44 Z" fill="url(#furHead)"/>

  <!-- ears, folded, on the top corners, drawn over the skull edge -->
  <g>
    <path d="M92 66 C66 62 48 82 52 112 C56 140 78 156 100 148 C88 126 86 92 92 66 Z" fill="url(#earOuter)"/>
    <path d="M228 66 C254 62 272 82 268 112 C264 140 242 156 220 148 C232 126 234 92 228 66 Z" fill="url(#earOuter)"/>
    <path d="M86 76 C66 78 58 96 60 114" fill="none" stroke="#7b7392" stroke-width="4" opacity="0.45" stroke-linecap="round"/>
    <path d="M234 76 C254 78 262 96 260 114" fill="none" stroke="#7b7392" stroke-width="4" opacity="0.45" stroke-linecap="round"/>
  </g>

  <!-- key light on forehead -->
  <ellipse cx="126" cy="84" rx="44" ry="28" fill="#ffffff" opacity="0.5" filter="url(#big)"/>
  <!-- lower shading -->
  <path d="M72 168 C96 222 224 222 248 168 C240 214 204 238 160 238 C116 238 80 214 72 168 Z" fill="#a8a8c2" opacity="0.4" filter="url(#soft)"/>

  <!-- forehead wrinkles -->
  <path d="M122 86 C142 74 178 74 198 86" fill="none" stroke="#cbcbdd" stroke-width="5" stroke-linecap="round" opacity="0.8"/>
  <path d="M128 100 C146 90 174 90 192 100" fill="none" stroke="#d4d4e4" stroke-width="4.5" stroke-linecap="round" opacity="0.65"/>

  <!-- soft dark eye patches (pug) -->
  <ellipse cx="126" cy="146" rx="32" ry="28" fill="#4a4459" opacity="0.30" filter="url(#tiny)"/>
  <ellipse cx="194" cy="146" rx="32" ry="28" fill="#4a4459" opacity="0.30" filter="url(#tiny)"/>

  <!-- muzzle mask: compact, centred on the snout -->
  <path d="M160 146 C186 146 202 164 202 186 C202 210 184 224 160 224 C136 224 118 210 118 186 C118 164 134 146 160 146 Z" fill="url(#maskG)"/>
  <path d="M160 148 C184 148 199 165 199 186 C199 208 183 221 160 221 C137 221 121 208 121 186 C121 165 136 148 160 148 Z" fill="none" stroke="#6d6680" stroke-width="6" opacity="0.28" filter="url(#tiny)"/>

  <!-- soft jowls, low-contrast, tucked at the sides of the mask -->
  <ellipse cx="108" cy="200" rx="26" ry="24" fill="url(#furCheek)" opacity="0.92" filter="url(#tiny)"/>
  <ellipse cx="212" cy="200" rx="26" ry="24" fill="url(#furCheek)" opacity="0.92" filter="url(#tiny)"/>

  <!-- eyebrows -->
  <path d="M100 116 C114 104 138 106 148 118" fill="none" stroke="#1b1825" stroke-width="11" stroke-linecap="round"/>
  <path d="M220 116 C206 104 182 106 172 118" fill="none" stroke="#1b1825" stroke-width="11" stroke-linecap="round"/>

  <!-- eyes -->
  <circle cx="126" cy="148" r="23" fill="url(#eyeBall)"/>
  <circle cx="194" cy="148" r="23" fill="url(#eyeBall)"/>
  <circle cx="118" cy="140" r="7.5" fill="#ffffff" opacity="0.92"/>
  <circle cx="186" cy="140" r="7.5" fill="#ffffff" opacity="0.92"/>
  <circle cx="133" cy="157" r="3.6" fill="#ffffff" opacity="0.3"/>
  <circle cx="201" cy="157" r="3.6" fill="#ffffff" opacity="0.3"/>

  <!-- nose bridge wrinkle -->
  <path d="M141 170 C150 163 170 163 179 170" fill="none" stroke="#242130" stroke-width="4" stroke-linecap="round" opacity="0.75"/>

  <!-- nose -->
  <path d="M160 176 C174 176 184 184 184 192 C184 201 173 208 160 208 C147 208 136 201 136 192 C136 184 146 176 160 176 Z" fill="url(#noseG)"/>
  <ellipse cx="151" cy="184" rx="6" ry="3.6" fill="#ffffff" opacity="0.26" filter="url(#tiny)"/>

  <!-- mouth -->
  <path d="M160 208 L160 213" stroke="#151220" stroke-width="4" stroke-linecap="round"/>
  <path d="M142 220 C150 213 170 213 178 220" fill="none" stroke="#151220" stroke-width="4.5" stroke-linecap="round"/>
</svg>
